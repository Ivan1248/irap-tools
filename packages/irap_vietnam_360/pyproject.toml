[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irap-vietnam-360"
version = "0.0.1"
description = "Fisheye-to-perspective image extraction using GPS track data"
requires-python = ">=3.10"
dependencies = [
    "av>=10.0.0",
    "numpy",
    "opencv-python",
    "scipy",
    "telemetry-parser",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
