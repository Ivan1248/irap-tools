[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irap-vietnam-data-preparation"
version = "0.1.0"
description = "End-to-end IRAP-Vietnam dataset preparation pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "xlrd",
    "pyarrow",
    "tqdm",
]

[project.optional-dependencies]
gui = ["streamlit>=1.35"]

[project.scripts]
irap-vn-download       = "irap_vietnam_data_preparation.download_images:main"
irap-vn-extract        = "irap_vietnam_data_preparation.extract_images:main"
irap-vn-parse-coding   = "irap_vietnam_data_preparation.parse_coding_tables:main"
irap-vn-build-metadata = "irap_vietnam_data_preparation.build_metadata:main"
irap-vn-make-splits    = "irap_vietnam_data_preparation.make_splits:main"
irap-vn-split-editor   = "irap_vietnam_data_preparation.split_editor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irap_vietnam_data_preparation = ["attribute_name_mapping.json"]
