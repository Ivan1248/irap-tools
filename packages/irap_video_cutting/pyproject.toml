[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irap-video-cutting"
version = "0.1.0"
description = "Cut MP4 + GPX / WebGIS sidecar files at manual timestamps"
requires-python = ">=3.10"
dependencies = [
    "av>=10.0.0",
    "numpy",
    "opencv-python",
    "scipy",
    "telemetry-parser",
    "tqdm",
]

[project.scripts]
cut-manual     = "irap_video_cutting.gpx.cut_manual:main"
cut-manual-gui = "irap_video_cutting.gpx.cut_manual_gui:main"
cut-webgis     = "irap_video_cutting.webgis.cut_webgis:main"
cut-webgis-gui = "irap_video_cutting.webgis.cut_webgis_gui:main"

[tool.setuptools.packages.find]
where = ["src"]
